<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>arclo-chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">arclo-chat</div>
      <a id="qr-link" href="/qr" target="_blank" rel="noopener">📱 Open on phone</a>

      <div class="section-title">Channels</div>
      <ul id="channels"></ul>
      <button id="add-channel" type="button">+ New channel</button>

      <div class="section-title">Direct messages</div>
      <ul id="dms"></ul>

      <div class="section-title">Online — click to DM</div>
      <ul id="presence"></ul>

      <div class="user-box">
        <label for="username">Display name</label>
        <input id="username" placeholder="your name" autocomplete="off">
      </div>
      <div id="version">arclo-chat v2026.5.1</div>
    </aside>

    <main id="main">
      <header id="channel-header">
        <button id="nav-toggle" type="button" aria-label="Toggle sidebar">☰</button>
        <span id="channel-name">#general</span>
      </header>
      <div id="messages"></div>
      <div id="typing"></div>
      <form id="composer">
        <input id="input" placeholder="Message #general" autocomplete="off">
        <button type="submit">Send</button>
      </form>
    </main>
    <div id="backdrop"></div>
  </div>
  <div id="status">connecting…</div>
  <script src="client.js"></script>
</body>
</html>
